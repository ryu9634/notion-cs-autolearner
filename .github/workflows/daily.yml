name: CS Daily

on:
  schedule:
    # KST 05:00 매일  =  UTC 20:00 (전날)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto(평일 daily / 주말 weekend) | daily | weekend | weekly'
        required: false
        default: 'auto'

# 학습 기록(til/)을 레포에 커밋·푸시하기 위해 필요하다
permissions:
  contents: write

concurrency:
  group: cs-daily
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      # 인증은 둘 중 하나만 있으면 된다.
      #  - CLAUDE_CODE_OAUTH_TOKEN: `claude setup-token` 으로 발급. Pro/Max 구독 한도에서 차감 (추천)
      #  - ANTHROPIC_API_KEY: 종량과금. Console 에 크레딧 잔액이 있어야 한다
      #
      # 주의: 인증 해석 순서가 ANTHROPIC_API_KEY -> OAuth 라서, 둘 다 주입하면
      # 크레딧이 0 인 API 키가 먼저 잡혀 실패한다. 그래서 아래 Run 스텝은
      # OAUTH 토큰이 있을 때 ANTHROPIC_API_KEY 를 의도적으로 빈 값으로 덮는다.
      - name: Check auth
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ]; then
            echo "인증: 구독 (CLAUDE_CODE_OAUTH_TOKEN)"
          elif [ -n "$APIKEY" ]; then
            echo "인증: 종량과금 (ANTHROPIC_API_KEY)"
          else
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN 또는 ANTHROPIC_API_KEY 중 하나를 secrets 에 넣어야 한다."
            exit 1
          fi

      - name: Run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && '' || secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_DS_ID: ${{ secrets.NOTION_DS_ID }}
        run: bash scripts/run-daily.sh "${{ github.event.inputs.mode || 'auto' }}"

      # 성공한 날만 학습 기록을 커밋한다 → 잔디.
      # 작성자를 본인 noreply 주소로 해야 contribution 으로 집계된다
      # (github-actions[bot] 이름으로 커밋하면 잔디가 안 심긴다).
      # 레포에 주기적으로 커밋이 생기므로 "60일 무활동 시 schedule 자동 비활성화"도 함께 막힌다.
      - name: Commit study log
        if: success()
        run: |
          git config user.name "ryu9634"
          git config user.email "95685556+ryu9634@users.noreply.github.com"
          git add til/
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
            exit 0
          fi
          git commit -m "TIL: $(TZ=Asia/Seoul date +%Y-%m-%d) CS Daily"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: logs/
          retention-days: 14
